name: Deploy to Production (main)

on:
  push:
    branches:
      - main

# Serialize deploys: a newer push cancels an in-flight build so rapid merges
# don't race to overwrite the :latest tag or fire out-of-order redeploys.
concurrency:
  group: deploy-prod
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set lowercase image name
        run: echo "IMAGE_LC=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]' | sed 's|/-|/|')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_LC }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_LC }}:${{ github.sha }}

      - name: Trigger Jelastic redeploy (Production)
        run: |
          if [ -z "${{ secrets.JELASTIC_WEBHOOK_PROD }}" ]; then
            echo "::warning::JELASTIC_WEBHOOK_PROD not set — skipping redeploy trigger."
            exit 0
          fi
          curl -fSs "${{ secrets.JELASTIC_WEBHOOK_PROD }}"
