services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"          # exposed locally for inspection (e.g. DBeaver)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      PYTHONUNBUFFERED: "1"
    ports:
      - "8501:8501"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src        # live-reload source in dev

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-u", "scheduler.py"]
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      PYTHONUNBUFFERED: "1"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./run_pipeline.py:/app/run_pipeline.py
      - ./scheduler.py:/app/scheduler.py

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-u", "run_pipeline.py"]
    env_file: .env
    environment:
      POSTGRES_HOST: db
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      PYTHONUNBUFFERED: "1"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./run_pipeline.py:/app/run_pipeline.py
    profiles:
      - worker               # excluded from `docker compose up -d` — use for manual one-shot runs

volumes:
  pg_data:
    driver: local
